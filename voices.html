<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>众说纷纭 — 周洇</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f3ef;--ink:#161616;--muted:#6e6e68;--faint:#a9a9a1;--line:#dcdad3;
  --panel:#ebe9e2;--paper:#faf9f5;
  --serif:"FangSong","STFangsong","华文仿宋","仿宋","SimSun","Songti SC",serif;}
[data-theme="dark"]{--bg:#0e0e0d;--ink:#e9e9e4;--muted:#8b8b84;--faint:#5c5c56;--line:#262623;
  --panel:#171715;--paper:#141412}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--serif);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;min-height:100vh}
::selection{background:var(--ink);color:var(--bg)}

/* ---- 控制栏 ---- */
.controls{position:fixed;top:18px;right:20px;display:flex;gap:12px;z-index:200}
.ctl{cursor:pointer;background:none;border:1px solid var(--line);color:var(--muted);padding:7px 13px;
  font-family:var(--serif);font-size:12px;letter-spacing:.16em;transition:all .25s ease;border-radius:0}
.ctl:hover{color:var(--ink);border-color:var(--ink)}
.ctl .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);
  margin-right:7px;vertical-align:1px;transition:background .25s}
.ctl:hover .dot{background:var(--ink)}

/* ---- 背景雨丝 ---- */
.rain-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.rain-bg .drop{position:absolute;top:-14vh;left:var(--x);width:1px;height:var(--len);
  background:linear-gradient(to bottom,transparent,var(--faint));opacity:var(--op);
  animation:rainFall var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes rainFall{0%{transform:translateY(0) rotate(6deg)}100%{transform:translateY(128vh) rotate(6deg)}}

/* ---- 主内容容器 ---- */
.page-container{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:84px 20px 64px;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.page-mark{font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--faint);margin-bottom:28px}
.page-mark::before{content:"— "}.page-mark::after{content:" —"}

/* ---- 文案渐显 (3s) ---- */
.p6-head{min-height:60px;margin-bottom:24px}
.p6-title{font-family:var(--serif);font-size:clamp(20px,4.8vw,26px);letter-spacing:.18em;color:var(--ink);
  opacity:0;transition:opacity 3s ease}
.p6-title.show{opacity:1}

/* ---- 留白双列 8 个画框 ---- */
.p6-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:440px;width:100%;margin:12px auto 32px;
  padding:0 8px}
.p6-frame{aspect-ratio:4/5;border:1px dashed var(--line);background:var(--panel);display:flex;
  align-items:center;justify-content:center;position:relative;transition:all .3s ease}
.p6-frame:hover{border-color:var(--muted);border-style:solid;background:var(--paper)}
.p6-frame-inner{display:flex;flex-direction:column;align-items:center;gap:10px}
.p6-frame-tag{font-family:var(--serif);font-size:12px;color:var(--faint);letter-spacing:.2em}
.p6-frame-text{font-family:var(--serif);font-size:14px;letter-spacing:.28em;color:var(--muted)}

/* ---- 底部导航方框 ---- */
.nav-boxes{display:flex;justify-content:center;gap:18px;margin:32px auto 14px;max-width:320px;width:100%}
.nav-box{flex:1;cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:var(--serif);font-size:14px;letter-spacing:.22em;padding:12px 14px;text-align:center;
  transition:all .3s ease;white-space:nowrap;text-decoration:none;display:inline-block}
.nav-box:hover{border-color:var(--ink);background:var(--panel)}

@media(max-width:560px){
  .page-container{padding:72px 14px 48px}
  .p6-grid{gap:12px}
}
</style>
</head>
<body>
<div class="controls">
  <button class="ctl music" id="musicBtn" aria-label="音乐"><span class="dot"></span>Sound</button>
  <button class="ctl theme" id="themeBtn" aria-label="切换深浅"><span class="dot"></span>Dark</button>
</div>
<audio id="bgm" loop preload="none"><source src="audio/forget-me.mp3" type="audio/mpeg"></audio>

<div class="page-container">
  <p class="page-mark">Voices · 众说纷纭</p>
  <div class="p6-head">
    <p class="p6-title" id="p6Title">众说纷纭，敬请期待</p>
  </div>
  <div class="p6-grid">
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 01</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 02</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 03</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 04</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 05</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 06</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 07</span><span class="p6-frame-text">敬请期待</span></div></div>
    <div class="p6-frame"><div class="p6-frame-inner"><span class="p6-frame-tag">№ 08</span><span class="p6-frame-text">敬请期待</span></div></div>
  </div>
  <div class="nav-boxes">
    <a class="nav-box" href="fragments.html">只言片语</a>
    <a class="nav-box" href="all.html">我所谓我</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  /* ---- 背景雨丝 ---- */
  var rainBg=document.createElement('div');
  rainBg.className='rain-bg';
  document.body.appendChild(rainBg);
  for(var ri=0;ri<70;ri++){
    var rd=document.createElement('span');
    rd.className='drop';
    rd.style.setProperty('--x',(Math.random()*100).toFixed(1)+'%');
    rd.style.setProperty('--len',(Math.random()*35+20).toFixed(0)+'px');
    rd.style.setProperty('--dur',(Math.random()*1.9+1.6).toFixed(2)+'s');
    rd.style.setProperty('--delay',(Math.random()*3.5).toFixed(2)+'s');
    rd.style.setProperty('--op',(Math.random()*0.3+0.15).toFixed(2));
    rainBg.appendChild(rd);
  }

  /* ---- 主题 ---- */
  var root=document.documentElement;
  var themeBtn=document.getElementById('themeBtn');
  function applyTheme(t){
    root.setAttribute('data-theme',t);
    var dark=(t==='dark');
    themeBtn.innerHTML='<span class="dot"></span>'+(dark?'Light':'Dark');
    themeBtn.querySelector('.dot').style.background=dark?'var(--ink)':'var(--muted)';
  }
  themeBtn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    applyTheme(next);try{localStorage.setItem('cy-theme',next);}catch(e){}
  });
  try{var saved=localStorage.getItem('cy-theme');if(saved)applyTheme(saved);}catch(e){}

  /* ---- 音乐 ---- */
  var bgm=document.getElementById('bgm');
  var musicBtn=document.getElementById('musicBtn');
  var playing=false;
  function setPlaying(p){
    playing=p;
    musicBtn.innerHTML='<span class="dot"></span>'+(p?'Pause':'Sound');
  }
  function toggleMusic(){
    if(playing){bgm.pause();setPlaying(false);}
    else{bgm.play().then(function(){setPlaying(true);}).catch(function(){setPlaying(false);});}
  }
  musicBtn.addEventListener('click',toggleMusic);

  /* ---- 进场动效 ---- */
  window.addEventListener('load', function(){
    setTimeout(function(){
      var t=document.getElementById('p6Title');
      if(t)t.classList.add('show');
    }, 300);
  });
})();
</script>
</body>
</html>

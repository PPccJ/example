<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>只言片语 — 周洇</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#f4f3ef;--ink:#161616;--muted:#6e6e68;--faint:#a9a9a1;--line:#dcdad3;
  --panel:#ebe9e2;--paper:#faf9f5;
  --serif:"FangSong","STFangsong","华文仿宋","仿宋","SimSun","Songti SC",serif;}
[data-theme="dark"]{--bg:#0e0e0d;--ink:#e9e9e4;--muted:#8b8b84;--faint:#5c5c56;--line:#262623;
  --panel:#171715;--paper:#141412}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--serif);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  transition:background .4s ease,color .4s ease;overflow-x:hidden;min-height:100vh}
::selection{background:var(--ink);color:var(--bg)}
img{display:block;filter:grayscale(1) contrast(1.05)}

/* ---- 控制栏 ---- */
.controls{position:fixed;top:18px;right:20px;display:flex;gap:12px;z-index:200}
.ctl{cursor:pointer;background:none;border:1px solid var(--line);color:var(--muted);padding:7px 13px;
  font-family:var(--serif);font-size:12px;letter-spacing:.16em;transition:all .25s ease;border-radius:0}
.ctl:hover{color:var(--ink);border-color:var(--ink)}
.ctl .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);
  margin-right:7px;vertical-align:1px;transition:background .25s}
.ctl:hover .dot{background:var(--ink)}

/* ---- 背景雨丝 ---- */
.rain-bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.rain-bg .drop{position:absolute;top:-14vh;left:var(--x);width:1px;height:var(--len);
  background:linear-gradient(to bottom,transparent,var(--faint));opacity:var(--op);
  animation:rainFall var(--dur) linear infinite;animation-delay:var(--delay)}
@keyframes rainFall{0%{transform:translateY(0) rotate(6deg)}100%{transform:translateY(128vh) rotate(6deg)}}

/* ---- 主内容容器 ---- */
.page-container{position:relative;z-index:2;max-width:680px;margin:0 auto;padding:84px 20px 64px;
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.page-mark{font-family:var(--serif);font-size:12px;letter-spacing:.3em;color:var(--faint);margin-bottom:28px}
.page-mark::before{content:"— "}.page-mark::after{content:" —"}

/* ---- 文案渐显 (3s) ---- */
.p5-head{min-height:90px;margin-bottom:20px}
.p5-title{font-family:var(--serif);font-size:clamp(20px,4.8vw,26px);letter-spacing:.16em;color:var(--ink);
  margin-bottom:12px;opacity:0;transition:opacity 3s ease}
.p5-title.show{opacity:1}
.p5-sub{font-family:var(--serif);font-size:14px;letter-spacing:.3em;color:var(--muted);
  opacity:0;transition:opacity 3s ease}
.p5-sub.show{opacity:1}

/* ---- 图片滑轨成堆从右侧滑入 ---- */
.p5-deck-wrap{position:relative;width:100%;margin:16px 0 28px;overflow:hidden;
  opacity:0;transform:translateX(100px);transition:opacity 1.6s ease,transform 1.6s cubic-bezier(.2,.8,.2,1)}
.p5-deck-wrap.show{opacity:1;transform:translateX(0)}
.p5-deck{display:flex;gap:20px;overflow-x:auto;padding:24px 20px 28px;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch}
.p5-deck::-webkit-scrollbar{height:4px}
.p5-deck::-webkit-scrollbar-track{background:transparent}
.p5-deck::-webkit-scrollbar-thumb{background:var(--line)}
.p5-card{flex:0 0 min(68vw,230px);scroll-snap-align:center;background:var(--paper);border:1px solid var(--line);
  padding:10px 10px 28px;box-shadow:0 6px 18px rgba(0,0,0,.04);transform:rotate(var(--rot));
  transition:transform .3s ease,box-shadow .3s ease}
.p5-card:hover{transform:rotate(0deg) translateY(-4px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
.p5-card-inner{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.p5-card-inner img{width:100%;height:100%;object-fit:cover}
.p5-card-idx{position:absolute;bottom:-22px;left:0;right:0;font-family:var(--serif);font-size:11px;
  color:var(--faint);letter-spacing:.2em;text-align:center}
.p5-hint{font-family:var(--serif);font-size:11px;letter-spacing:.25em;color:var(--faint);margin-top:6px}

/* ---- 底部导航方框 ---- */
.nav-boxes{display:flex;justify-content:center;gap:18px;margin:32px auto 14px;max-width:320px;width:100%}
.nav-box{flex:1;cursor:pointer;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-family:var(--serif);font-size:14px;letter-spacing:.22em;padding:12px 14px;text-align:center;
  transition:all .3s ease;white-space:nowrap;text-decoration:none;display:inline-block}
.nav-box:hover{border-color:var(--ink);background:var(--panel)}

@media(max-width:560px){
  .page-container{padding:72px 14px 48px}
}
</style>
</head>
<body>
<div class="controls">
  <button class="ctl music" id="musicBtn" aria-label="音乐"><span class="dot"></span>Sound</button>
  <button class="ctl theme" id="themeBtn" aria-label="切换深浅"><span class="dot"></span>Dark</button>
</div>
<audio id="bgm" loop preload="none"><source src="audio/forget-me.mp3" type="audio/mpeg"></audio>

<div class="page-container">
  <p class="page-mark">Fragments · 只言片语</p>
  <div class="p5-head">
    <p class="p5-title" id="p5Title">辞藻字句不过是灵感乍现</p>
    <p class="p5-sub" id="p5Sub">仅供参考</p>
  </div>
  <div class="p5-deck-wrap" id="p5DeckWrap">
    <div class="p5-deck">
      <div class="p5-card" style="--rot:-2deg"><div class="p5-card-inner"><img src="images/img-001.jpg" alt=""><span class="p5-card-idx">№ 01</span></div></div>
      <div class="p5-card" style="--rot:1.5deg"><div class="p5-card-inner"><img src="images/img-002.jpg" alt=""><span class="p5-card-idx">№ 02</span></div></div>
      <div class="p5-card" style="--rot:-1deg"><div class="p5-card-inner"><img src="images/img-003.jpg" alt=""><span class="p5-card-idx">№ 03</span></div></div>
      <div class="p5-card" style="--rot:2.5deg"><div class="p5-card-inner"><img src="images/img-004.jpg" alt=""><span class="p5-card-idx">№ 04</span></div></div>
      <div class="p5-card" style="--rot:-2deg"><div class="p5-card-inner"><img src="images/img-005.jpg" alt=""><span class="p5-card-idx">№ 05</span></div></div>
      <div class="p5-card" style="--rot:1deg"><div class="p5-card-inner"><img src="images/img-006.jpg" alt=""><span class="p5-card-idx">№ 06</span></div></div>
      <div class="p5-card" style="--rot:-1.5deg"><div class="p5-card-inner"><img src="images/img-007.jpg" alt=""><span class="p5-card-idx">№ 07</span></div></div>
      <div class="p5-card" style="--rot:2deg"><div class="p5-card-inner"><img src="images/img-008.jpg" alt=""><span class="p5-card-idx">№ 08</span></div></div>
      <div class="p5-card" style="--rot:-0.5deg"><div class="p5-card-inner"><img src="images/img-009.jpg" alt=""><span class="p5-card-idx">№ 09</span></div></div>
    </div>
    <p class="p5-hint">← 左右滑动查阅 · 灵感碎片 →</p>
  </div>
  <div class="nav-boxes">
    <a class="nav-box" href="all.html">我所谓我</a>
    <a class="nav-box" href="voices.html">众说纷纭</a>
  </div>
</div>

<script>
(function(){
  'use strict';
  /* ---- 背景雨丝 ---- */
  var rainBg=document.createElement('div');
  rainBg.className='rain-bg';
  document.body.appendChild(rainBg);
  for(var ri=0;ri<70;ri++){
    var rd=document.createElement('span');
    rd.className='drop';
    rd.style.setProperty('--x',(Math.random()*100).toFixed(1)+'%');
    rd.style.setProperty('--len',(Math.random()*35+20).toFixed(0)+'px');
    rd.style.setProperty('--dur',(Math.random()*1.9+1.6).toFixed(2)+'s');
    rd.style.setProperty('--delay',(Math.random()*3.5).toFixed(2)+'s');
    rd.style.setProperty('--op',(Math.random()*0.3+0.15).toFixed(2));
    rainBg.appendChild(rd);
  }

  /* ---- 主题 ---- */
  var root=document.documentElement;
  var themeBtn=document.getElementById('themeBtn');
  function applyTheme(t){
    root.setAttribute('data-theme',t);
    var dark=(t==='dark');
    themeBtn.innerHTML='<span class="dot"></span>'+(dark?'Light':'Dark');
    themeBtn.querySelector('.dot').style.background=dark?'var(--ink)':'var(--muted)';
  }
  themeBtn.addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    applyTheme(next);try{localStorage.setItem('cy-theme',next);}catch(e){}
  });
  try{var saved=localStorage.getItem('cy-theme');if(saved)applyTheme(saved);}catch(e){}

  /* ---- 音乐 ---- */
  var bgm=document.getElementById('bgm');
  var musicBtn=document.getElementById('musicBtn');
  var playing=false;
  function setPlaying(p){
    playing=p;
    musicBtn.innerHTML='<span class="dot"></span>'+(p?'Pause':'Sound');
  }
  function toggleMusic(){
    if(playing){bgm.pause();setPlaying(false);}
    else{bgm.play().then(function(){setPlaying(true);}).catch(function(){setPlaying(false);});}
  }
  musicBtn.addEventListener('click',toggleMusic);

  /* ---- 进场动效 ---- */
  window.addEventListener('load', function(){
    setTimeout(function(){
      var t=document.getElementById('p5Title');
      var s=document.getElementById('p5Sub');
      if(t)t.classList.add('show');
      if(s)s.classList.add('show');
    }, 300);

    setTimeout(function(){
      var deck=document.getElementById('p5DeckWrap');
      if(deck)deck.classList.add('show');
    }, 2500);
  });
})();
</script>
</body>
</html>
